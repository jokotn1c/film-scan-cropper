name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'film_*.py'
      - 'requirements*.txt'
      - 'FilmCrop-RAW-mac-arm64.spec'
      - 'build_macos_arm64.sh'
      - 'tools/**'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/build-macos-arm64.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Verify Apple Silicon
        run: python -c "import platform; assert platform.machine() == 'arm64'"

      - name: Build app
        run: bash build_macos_arm64.sh

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check packaged app startup
        run: python tools/check_macos_startup.py

      - name: Read release version
        id: release
        run: echo "version=$(python -c 'from film_version import VERSION; print(VERSION)')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: FilmCrop-RAW-${{ steps.release.outputs.version }}-mac-arm64
          path: |
            dist-macos-arm64/FilmCrop-RAW-*-mac-arm64.zip
            dist-macos-arm64/FilmCrop-RAW-*-mac-arm64.sha256
            dist-macos-arm64/startup-check.json
